[project]
name = "package"
version = "0.1.0"
description = "Minimal FastAPI backend scaffold for project-template"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi~=0.115",
    "pydantic~=2.10",
    "pydantic-settings~=2.6",
    "uvicorn[standard]~=0.34",
]

[dependency-groups]
dev = [
    "httpx2~=2.9",
    "mypy==2.3.0",
    "pre-commit~=4.6",
    "pyright~=1.1",
    "pytest~=9.1",
    "pytest-cov~=7.1",
    "ruff==0.16.1",
]
test = [
    "httpx2~=2.9",
    "pytest~=9.1",
    "pytest-cov~=7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["package"]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["."]

[tool.mypy]
strict = true
files = ["package"]

[tool.pyright]
include = ["package"]
