name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: "npm"
          cache-dependency-path: projects/frontend/package-lock.json

      - name: Install dependencies
        run: cd projects/frontend && npm ci

      - name: Prettier check
        run: cd projects/frontend && npm run prettier:check

      - name: Run ESLint
        run: cd projects/frontend && npm run lint

      - name: Typecheck
        run: cd projects/frontend && npm run typecheck

      - name: Build
        run: cd projects/frontend && NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8000 npm run build

  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dependencies
        run: uv sync --all-groups --all-packages --python ${{ matrix.python-version }}

      - name: Run ruff linting
        run: uv run ruff check projects/backend

      - name: Run ruff format check
        run: uv run ruff format --check projects/backend

      - name: Check for sys.path mutation hacks
        run: uv run python scripts/check_no_sys_path_mutation.py

      - name: Type check with pyright
        run: uv run pyright projects/backend/package

      - name: Type check with mypy
        run: PYTHONPATH=projects/backend uv run mypy projects/backend/package

      - name: Run tests
        run: PYTHONPATH=projects/backend uv run pytest projects/backend/tests -v --tb=short

      - name: Run tests with coverage
        run: PYTHONPATH=projects/backend uv run pytest projects/backend/tests --cov=projects/backend/package --cov-report=term --cov-report=xml --cov-fail-under=80

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'  # Only upload once from latest version
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Coverage Summary
        if: matrix.python-version == '3.13'  # Only show once from latest version
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          PYTHONPATH=projects/backend uv run pytest projects/backend/tests --cov=projects/backend/package --cov-report=term | tail -n 10 >> $GITHUB_STEP_SUMMARY
